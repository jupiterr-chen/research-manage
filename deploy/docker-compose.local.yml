# 本地全链路 compose(R-DEP-03 / DESIGN §8):管理台容器 + llm-stub。
# 网络名固定 research-manage_default(= AM_TA_NETWORK),执行容器加入后可解析 llm-stub。
# 本地 Windows(Docker Desktop)用法:
#   1) 生成 deploy/.env(模板见 deploy/.env.example;AM_*_HOST 用 D:/… 绝对路径)
#   2) 先构建 sim/llm-stub 镜像:scripts/build_sim.sh、docker build -t llm-stub:latest sim/llm_stub
#   3) docker compose -f deploy/docker-compose.local.yml up -d --build
name: research-manage

services:
  agents-manage:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1000}
    # Windows Docker Desktop 的 /var/run/docker.sock 属 root:root(无 docker 组可用),
    # 本地只能以 root 跑;NAS 生产 compose 用 1000:994(uid=chen,gid=docker 组,见 DEPLOY.md §1)
    user: "0:0"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AM_TA_DATA_HOST}:${AM_TA_DATA_DIR:-/ta-data}:ro
      - ${AM_DATA_HOST}:${AM_DATA_DIR:-/app-data}
      # 注:runner.py 不需挂进管理台——AM_RUNNER_HOST 只是传给 docker-py 的宿主路径字符串,
      # 由 daemon 在宿主侧解析(Windows 用 D:/x/y 形式,见 deploy/.env.example)
    environment:
      - AM_BIND=0.0.0.0
      - AM_PORT=8090
      - AM_TOKEN=${AM_TOKEN:?需要在 deploy/.env 设置 AM_TOKEN}
      - AM_TA_IMAGE=${AM_TA_IMAGE:-tradingagents-sim:latest}
      - AM_TA_DATA_HOST=${AM_TA_DATA_HOST:?}
      - AM_TA_ENV_HOST=${AM_TA_ENV_HOST:?}
      - AM_RUNNER_HOST=${AM_RUNNER_HOST:?}
      - AM_DATA_HOST=${AM_DATA_HOST:?}
      - AM_TA_DATA_DIR=${AM_TA_DATA_DIR:-/ta-data}
      - AM_DATA_DIR=${AM_DATA_DIR:-/app-data}
      - AM_TA_NETWORK=research-manage_default
      - AM_SIM_ENV=${AM_SIM_ENV:-SIM_MODE=ok,TRADINGAGENTS_CHECKPOINT_ENABLED=true}
      - TZ=Asia/Shanghai
      # 财报原文获取(可选;默认空 = 功能关闭)
      # 连本 compose 内 reports-mock 用 http://reports-mock:8080;
      # 连宿主 integration-kit mock(127.0.0.1:18765)用 http://host.docker.internal:18765(docs/REPORTS-FETCHER.md §4)
      - REPORTS_API_BASE_URL=${REPORTS_API_BASE_URL:-}
      - REPORTS_API_TOKEN=${REPORTS_API_TOKEN:-}
      - REPORTS_API_TIMEOUT=${REPORTS_API_TIMEOUT:-30}
      - REPORTS_API_MAX_WAIT=${REPORTS_API_MAX_WAIT:-900}
      - REPORTS_API_POLL_INTERVAL=${REPORTS_API_POLL_INTERVAL:-2}
      - REPORTS_API_POLL_MAX_INTERVAL=${REPORTS_API_POLL_MAX_INTERVAL:-10}
      - REPORTS_API_LAST_N_DEFAULT=${REPORTS_API_LAST_N_DEFAULT:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内 host.docker.internal 指向 Windows 宿主(Linux Docker 28+ 与 Docker Desktop 均可用)
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8090/healthz', headers={'Authorization': 'Bearer ' + os.environ['AM_TOKEN']}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  llm-stub:
    build: ../sim/llm_stub
    image: llm-stub:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      STUB_DELAY_SECONDS: "0"

  # 可选:本地 reports-fetcher mock(integration-kit,只读挂载;状态纯内存,重启即清空)。
  # 启用:docker compose -f deploy/docker-compose.local.yml --profile reports up -d
  # 与 agents-manage 同在默认网络,故容器内既可用 http://reports-mock:8080,
  # 也可经宿主端口用 http://host.docker.internal:18765。
  reports-mock:
    image: python:3.12-slim
    working_dir: /kit
    volumes:
      - ../integration-kit:/kit:ro
    command: ["python", "mock/server.py", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:18765:8080"
    profiles: ["reports"]
