# 生产 compose(NAS /home/chen/docker/agents-manage/,SPEC §9 / R-DEP-02)
# 用法:在同步目录根部执行 docker compose -f deploy/docker-compose.yml up -d
# 挂载源均为宿主路径;./…、../… 相对本文件所在目录(deploy/)。
name: agents-manage   # compose 项目名(否则默认取目录名 deploy;T-04)
services:
  agents-manage:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-994}
    user: "${APP_UID:-1000}:${DOCKER_GID:-994}"   # uid=宿主 chen(TA data 同 owner),gid=docker 组
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock     # 启停执行容器(已获用户认可;socket-proxy 方案见 DEPLOY.md §6)
      - /home/chen/docker/TradingAgents/data:/ta-data:ro  # 只读:判定报告/记忆实况
      - ../data:/app-data                              # SQLite + runs/<id>/(status.json、container.log)
      - ../runner:/runner:ro                           # runner.py 挂载给执行容器
    environment:
      - AM_BIND=0.0.0.0            # 容器内监听;LAN 暴露由 ports 映射实现(见 DEPLOY.md §2)
      - AM_PORT=8090
      - AM_TOKEN=${AM_TOKEN:?需要在 deploy/.env 设置 AM_TOKEN(deploy/.env.example)}
      - AM_TA_IMAGE=tradingagents-tradingagents:latest
      - AM_TA_DATA_HOST=/home/chen/docker/TradingAgents/data
      - AM_TA_ENV_HOST=/home/chen/docker/TradingAgents/.env
      - AM_RUNNER_HOST=/home/chen/docker/agents-manage/runner/runner.py
      - AM_DATA_HOST=/home/chen/docker/agents-manage/data
      - AM_TA_DATA_DIR=/ta-data
      - AM_DATA_DIR=/app-data
      - AM_SMB_PREFIX=\\192.168.1.150\docker\TradingAgents\data
      - AM_WATCHDOG_MINUTES=120
      - AM_STALE_MINUTES=20
      - AM_RETENTION_DAYS=90
      - TZ=Asia/Shanghai
      # 财报原文获取(可选;默认空 = 功能关闭,不改变现有生产行为)
      # REPORTS_API_BASE_URL 不含 /api/v1;生产填 http://host.docker.internal:8000(docs/REPORTS-FETCHER.md §6)
      - REPORTS_API_BASE_URL=${REPORTS_API_BASE_URL:-}
      - REPORTS_API_TOKEN=${REPORTS_API_TOKEN:-}
      - REPORTS_API_TIMEOUT=${REPORTS_API_TIMEOUT:-30}
      - REPORTS_API_MAX_WAIT=${REPORTS_API_MAX_WAIT:-900}
      - REPORTS_API_POLL_INTERVAL=${REPORTS_API_POLL_INTERVAL:-2}
      - REPORTS_API_POLL_MAX_INTERVAL=${REPORTS_API_POLL_MAX_INTERVAL:-10}
      - REPORTS_API_LAST_N_DEFAULT=${REPORTS_API_LAST_N_DEFAULT:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内 host.docker.internal 指向 NAS 宿主(reports-fetcher 发布在该机回环 127.0.0.1:8000)
    ports:
      - "192.168.1.150:8090:8090"   # 只发布在 LAN 网卡(SPEC §8;T-02)
    healthcheck:
      # /healthz 需鉴权;容器内环境变量可取 token,docker inspect 本就可见 AM_TOKEN(SPEC §9 设计)
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8090/healthz', headers={'Authorization': 'Bearer ' + os.environ['AM_TOKEN']}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
