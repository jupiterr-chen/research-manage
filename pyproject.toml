[project]
name = "research-manage"
version = "0.1.0"
description = "TradingAgents research task management console (Agents-Manage)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py311"
# docs/:Markdown 中的 Python 代码样例是文档内容,格式化会产生无意义 diff
extend-exclude = ["vendor", ".local", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入与表单参数的惯用法:Depends/Form 作为参数默认值
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.params.Depends",
  "fastapi.Form",
  "fastapi.params.Form",
  "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"sim/**" = ["S"]
# SQL 字符串只插值模块级常量列清单(_COLS/_RUN_COLS/内部表名字典),动态值一律走 ? 占位
"app/services/**" = ["S608"]
"app/db.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: needs local Docker daemon and tradingagents-sim:latest image",
  "acceptance: acceptance cases mapped to docs/ACCEPTANCE.md",
  "shape: needs vendor/ copied read-only from NAS (contract parity)",
  "real: needs tradingagents-local:latest (built from vendor/) and llm-stub",
  "reports_mock: needs reports-fetcher mock at 127.0.0.1:18765 (integration-kit/compose.yaml)",
]
addopts = "-ra"
