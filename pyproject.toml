[project]
name = "research-manage"
version = "0.1.0"
description = "TradingAgents research task management console (Agents-Manage)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["vendor", ".local", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"sim/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: needs local Docker daemon and tradingagents-sim:latest image",
  "acceptance: acceptance cases mapped to docs/ACCEPTANCE.md",
  "shape: needs vendor/tradingagents copied read-only from NAS",
]
addopts = "-ra"
